[project]
name = "aviametrics"
version = "0.1.0"
description = "Aviametrics – flight data analysis platform (showcase prototype)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27", "orjson>=3.10", "pyarrow>=17", "duckdb>=1.1",
  "dagster>=1.8", "dagster-webserver>=1.8",
  "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8",
  "streamlit>=1.40", "pydeck>=0.9", "altair>=5", "pandas>=2.2",
]

[tool.dagster]
module_name = "aviametrics.pipeline.definitions"
