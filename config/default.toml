# Aviametrics configuration profile (showcase = Core scope, Austria)
[area]
name = "Austria"
bbox_core = [46.37, 49.02, 9.53, 17.16]     # lat_min, lat_max, lon_min, lon_max
bbox_buffer = [46.0, 49.3, 9.0, 17.6]       # stored area incl. border buffer
center = [47.7, 13.35]
live_radius_nm = 250

[sources]
archive = "https://github.com/adsblol/globe_history_{year}/releases/download/v{year}.{month}.{day}-planes-readsb-prod-0/v{year}.{month}.{day}-planes-readsb-prod-0.tar.{part}"
live = [   # fallback chain: first that answers wins
  "https://api.adsb.lol/v2/point/{lat}/{lon}/{radius}",
  "https://opendata.adsb.fi/api/v2/lat/{lat}/lon/{lon}/dist/{radius}",
  "https://api.airplanes.live/v2/point/{lat}/{lon}/{radius}",
]
live_cache_seconds = 5

[processing]
segment_gap_s = 600          # new flight segment after 10 min without signal

[app]
default_language = "de"

[storage]
table_layer = "ducklake"     # "ducklake" (catalog + snapshots + atomic writes) or "parquet" (plain day-partitioned files)
catalog = "sqlite"           # DuckLake catalog database: "sqlite" (several local processes) – PostgreSQL for multi-user servers
