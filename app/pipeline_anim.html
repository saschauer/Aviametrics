<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;font-family:Georgia,serif;color:#e9e4d8}
.job{background:#15181d;border:1px solid #3a3222;border-radius:10px;padding:14px 18px 10px;margin-bottom:10px}
.head{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.head b{color:#e7c27d;font-size:19px;letter-spacing:.04em}
.run{font:13px system-ui,sans-serif;color:#a9a294}
.msg{font:13px system-ui,sans-serif;color:#a9a294;margin-top:2px;min-height:18px}
svg{width:100%;height:150px;display:block}
.lbl{font:12px system-ui,sans-serif;fill:#a9a294;text-anchor:middle}
.lbl.on{fill:#e7c27d;font-weight:600}
.dot{fill:#15181d;stroke:#6b5a33;stroke-width:2}
.dot.done{fill:#d9b36c;stroke:#d9b36c}
.dot.on{fill:#0e1013;stroke:#e7c27d;stroke-width:3}
.dot.fail{fill:#a3261b;stroke:#e06c5c}
.pulse{fill:none;stroke:#e7c27d;stroke-width:2;opacity:.8;animation:p 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{from{r:9;opacity:.9}to{r:26;opacity:0}}
.route{fill:none;stroke:#3a3222;stroke-width:3;stroke-dasharray:2 8;stroke-linecap:round}
.flown{fill:none;stroke:#d9b36c;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.plane{transition:transform 1s linear}
.contrail{animation:c 1.2s linear infinite}
@keyframes c{from{stroke-dashoffset:0}to{stroke-dashoffset:-20}}
.icon{font:600 13px system-ui,sans-serif;fill:#e9e4d8;text-anchor:middle;dominant-baseline:central}
.dot.done+.icon{fill:#0e1013}
.empty{font:13px system-ui,sans-serif;color:#a9a294;padding:6px 2px}
.bar{height:4px;background:#2a2620;border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d9b36c,#ffb35c);transition:width 1s linear}
</style></head>
<body><div id="root"><div class="empty">…</div></div>
<script>
const API="__API__", L=__LABELS__;
const STAGES=["download","extract","parse","enrich","write","flights"], ICON=["1","2","3","4","5","6"];
const W=1000, Y=70, X0=60, X1=940, xs=STAGES.map((_,i)=>X0+i*(X1-X0)/(STAGES.length-1));
const path=`M ${X0} ${Y} `+xs.slice(1).map((x,i)=>`Q ${(xs[i]+x)/2} ${i%2?Y+34:Y-34} ${x} ${Y}`).join(" ");
const cards={};
function card(day,run){
  const key=day+"|"+run; if(cards[key]) return cards[key];
  const el=document.createElement("div"); el.className="job";
  el.innerHTML=`<div class="head"><span><b>${day}</b> <span class="run"></span> · <span class="st"></span></span><span class="tm"></span></div>
  <svg viewBox="0 0 ${W} 150"><path class="route" d="${path}"/><path class="flown" d="${path}"/>
  ${xs.map((x,i)=>`<g><circle class="dot" cx="${x}" cy="${Y}" r="16"/><text class="icon" x="${x}" y="${Y}">${ICON[i]}</text>
  <text class="lbl" x="${x}" y="${Y+42}">${L["stage_"+STAGES[i]]}</text></g>`).join("")}
  <g class="plane"><path class="pl" d="M16,0 L10,-2 L2,-2 L-4,-12 L-8,-12 L-4,-2 L-11,-2 L-14,-6 L-16,-6 L-15,0 L-16,6 L-14,6 L-11,2 L-4,2 L-8,12 L-4,12 L2,2 L10,2 Z" fill="#ffd27a" transform="rotate(0)" style="filter:drop-shadow(0 0 6px rgba(255,190,90,.8))"/></g></svg>
  <div class="msg"></div><div class="bar"><i style="width:0"></i></div>`;
  document.getElementById("root").appendChild(el);
  const p=el.querySelector(".flown"), len=el.querySelector(".route").getTotalLength();
  p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
  return cards[key]={el,p,len,route:el.querySelector(".route")};
}
function render(j){
  const root=document.getElementById("root");
  if(!j||!j.jobs||!j.jobs.length){root.innerHTML=`<div class="empty">${L.no_jobs}</div>`;for(const k in cards)delete cards[k];return}
  if(root.querySelector(".empty"))root.innerHTML="";
  for(const job of j.jobs){
    const c=card(job.day, job.run||""), st=job.status, idx=Math.max(0,STAGES.indexOf(job.stage));
    const done=new Set(job.done_stages||[]);
    let frac = st==="done"?1 : st==="queued"?0 : (idx+Math.min(1,(job.pct||0)/100)*(job.pct==null?0.5:1))/(STAGES.length-1);
    frac=Math.min(1,Math.max(0,frac));
    c.p.style.strokeDashoffset=c.len*(1-frac);
    const pt=c.route.getPointAtLength(c.len*frac), pt2=c.route.getPointAtLength(Math.min(c.len,c.len*frac+4));
    const ang=Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI;
    const plane=c.el.querySelector(".plane"); plane.style.transform=`translate(${pt.x}px,${pt.y-2}px)`;
    plane.querySelector(".pl").setAttribute("transform",`rotate(${ang})`);
    plane.style.opacity = (st==="running")?1:0;
    c.el.querySelectorAll(".dot").forEach((d,i)=>{
      const s=STAGES[i]; d.setAttribute("class","dot"+(st==="done"||done.has(s)?" done": i===idx&&st==="failed"?" fail": i===idx&&st==="running"?" on":""));
      const old=d.parentNode.querySelector(".pulse"); if(old) old.remove();
      if(i===idx&&st==="running"){const r=document.createElementNS("http://www.w3.org/2000/svg","circle");r.setAttribute("class","pulse");r.setAttribute("cx",d.getAttribute("cx"));r.setAttribute("cy",Y);r.setAttribute("r",9);d.parentNode.insertBefore(r,d)}
    });
    c.el.querySelectorAll(".lbl").forEach((t,i)=>t.setAttribute("class","lbl"+(i===idx&&st==="running"?" on":"")));
    const col={queued:"#a9a294",running:"#e7c27d",done:"#7fbf7f",failed:"#e06c5c"}[st]||"#a9a294";
    const se=c.el.querySelector(".st"); se.textContent=L["st_"+st]||st; se.style.color=col;
    if(job.run){const r=job.run; c.el.querySelector(".run").textContent=`· ${L.attempt} ${r.slice(9,11)}:${r.slice(11,13)}:${r.slice(13,15)}`}
    const el=Math.max(0,Math.round((job.updated||0)-(job.started||0)));
    c.el.querySelector(".tm").textContent=`${Math.floor(el/60)}:${String(el%60).padStart(2,"0")} min`;
    c.el.querySelector(".msg").textContent = st==="done"?L.job_done : st==="queued"?L.queued_hint : (job.msg||"");
    c.el.querySelector(".msg").style.color = st==="failed"?"#e06c5c":"#a9a294";
    c.el.querySelector(".bar i").style.width=(frac*100)+"%";
  }
}
async function poll(){try{const r=await fetch(API+"/v1/jobs");render(await r.json())}catch(e){document.getElementById("root").innerHTML=`<div class="empty">API not reachable</div>`}}
poll(); setInterval(poll,1000);
</script></body></html>
