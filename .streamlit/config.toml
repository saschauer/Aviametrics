[theme]
base = "dark"
primaryColor = "#d9b36c"
backgroundColor = "#0e1013"
secondaryBackgroundColor = "#171a1f"
textColor = "#e9e4d8"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"          # no Deploy button / developer menu
showErrorDetails = false

[ui]
hideTopBar = true
